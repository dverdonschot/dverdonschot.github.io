<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#0d1f26"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8f9c"/>
    </marker>
  </defs>

  <!-- lane labels -->
  <text x="1160" y="54" fill="#6f828f" font-size="17" letter-spacing="2" text-anchor="end">AGENT MACHINE</text>
  <text x="1160" y="300" fill="#6f828f" font-size="17" letter-spacing="2" text-anchor="end">HOMELAB SERVER</text>

  <!-- agent -->
  <rect x="60" y="40" width="340" height="84" rx="12" fill="#14303a" stroke="#1e4652" stroke-width="2"/>
  <text x="230" y="76" fill="#f1f5f9" font-size="22" font-weight="700" text-anchor="middle">AI agent</text>
  <text x="230" y="104" fill="#8b9aa6" font-size="16" text-anchor="middle">writes Nix, pushes a branch</text>

  <!-- client -->
  <rect x="60" y="170" width="340" height="84" rx="12" fill="#14303a" stroke="#1e4652" stroke-width="2"/>
  <text x="230" y="206" fill="#f1f5f9" font-size="22" font-weight="700" text-anchor="middle">gated-deploy client</text>
  <text x="230" y="234" fill="#8b9aa6" font-size="16" text-anchor="middle">one binary, shared by every harness</text>

  <!-- mcp -->
  <rect x="880" y="170" width="280" height="84" rx="12" fill="#14303a" stroke="#1e4652" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="1020" y="206" fill="#f1f5f9" font-size="22" font-weight="700" text-anchor="middle">nixos MCP lookup</text>
  <text x="1020" y="234" fill="#8b9aa6" font-size="16" text-anchor="middle">read-only, cannot execute</text>

  <!-- arrows: agent -> client -->
  <line x1="230" y1="124" x2="230" y2="162" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="248" y="150" fill="#9fb3c0" font-size="15">runs</text>

  <!-- arrows: client -> mcp -->
  <line x1="400" y1="212" x2="870" y2="212" stroke="#7d8f9c" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowMuted)"/>
  <text x="635" y="200" fill="#9fb3c0" font-size="15" text-anchor="middle">asks for real option and package names</text>

  <!-- api service -->
  <rect x="60" y="320" width="340" height="92" rx="12" fill="#14303a" stroke="#1e4652" stroke-width="2"/>
  <text x="230" y="352" fill="#f1f5f9" font-size="22" font-weight="700" text-anchor="middle">API service</text>
  <text x="230" y="378" fill="#8b9aa6" font-size="16" text-anchor="middle">unprivileged user, loopback port</text>
  <text x="230" y="398" fill="#8b9aa6" font-size="15" text-anchor="middle">POST /deploy { host, action, branch }</text>

  <!-- allowlist -->
  <rect x="520" y="320" width="330" height="92" rx="12" fill="#12262f" stroke="#3b82f6" stroke-width="2"/>
  <text x="685" y="352" fill="#f1f5f9" font-size="21" font-weight="700" text-anchor="middle">Nix allowlist</text>
  <text x="685" y="378" fill="#8b9aa6" font-size="16" text-anchor="middle">generated by the flake at build time</text>
  <text x="685" y="398" fill="#8b9aa6" font-size="16" text-anchor="middle">argv arrays, not command strings</text>

  <!-- helper -->
  <rect x="60" y="460" width="340" height="92" rx="12" fill="#14303a" stroke="#1e4652" stroke-width="2"/>
  <text x="230" y="492" fill="#f1f5f9" font-size="22" font-weight="700" text-anchor="middle">root helper</text>
  <text x="230" y="518" fill="#8b9aa6" font-size="16" text-anchor="middle">one sudoers rule, job id only</text>
  <text x="230" y="538" fill="#8b9aa6" font-size="15" text-anchor="middle">checks out the branch, builds the argv</text>

  <!-- unit -->
  <rect x="60" y="600" width="340" height="92" rx="12" fill="#12262f" stroke="#3b82f6" stroke-width="2"/>
  <text x="230" y="632" fill="#f1f5f9" font-size="20" font-weight="700" text-anchor="middle">transient systemd unit</text>
  <text x="230" y="660" fill="#8b9aa6" font-size="16" text-anchor="middle">nixos-rebuild switch --flake .#host</text>

  <!-- vertical arrows -->
  <line x1="230" y1="254" x2="230" y2="312" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="248" y="290" fill="#9fb3c0" font-size="15">HTTPS over the tailnet, bearer token</text>

  <line x1="230" y1="412" x2="230" y2="452" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="248" y="440" fill="#9fb3c0" font-size="15">sudo: one job id</text>

  <line x1="230" y1="552" x2="230" y2="592" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="248" y="580" fill="#9fb3c0" font-size="15">systemd-run</text>

  <!-- allowlist reads -->
  <line x1="400" y1="366" x2="512" y2="366" stroke="#7d8f9c" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowMuted)"/>
  <text x="456" y="356" fill="#9fb3c0" font-size="14" text-anchor="middle">reads</text>

  <path d="M 685 412 L 685 506 L 408 506" fill="none" stroke="#7d8f9c" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowMuted)"/>
  <text x="600" y="496" fill="#9fb3c0" font-size="14" text-anchor="middle">builds the argv</text>

  <!-- footer -->
  <text x="60" y="732" fill="#6f828f" font-size="16">The agent never holds a shell on the server, and never reads a file on it.</text>
</svg>
