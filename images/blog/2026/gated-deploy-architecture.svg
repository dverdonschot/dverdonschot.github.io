<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#0d1f26"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8f9c"/>
    </marker>
  </defs>

  <!-- agent -->
  <rect x="60" y="40" width="340" height="84" rx="12" fill="#14303a" stroke="#1e4652" stroke-width="2"/>
  <text x="230" y="76" fill="#f1f5f9" font-size="22" font-weight="700" text-anchor="middle">AI agent</text>
  <text x="230" y="104" fill="#8b9aa6" font-size="16" text-anchor="middle">writes Nix, pushes a branch</text>

  <!-- mcp lookup, same machine as the agent -->
  <rect x="820" y="40" width="340" height="84" rx="12" fill="#14303a" stroke="#1e4652" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="990" y="76" fill="#f1f5f9" font-size="22" font-weight="700" text-anchor="middle">nixos MCP lookup</text>
  <text x="990" y="104" fill="#8b9aa6" font-size="16" text-anchor="middle">read-only, cannot execute</text>

  <!-- client -->
  <rect x="60" y="180" width="340" height="84" rx="12" fill="#14303a" stroke="#1e4652" stroke-width="2"/>
  <text x="230" y="216" fill="#f1f5f9" font-size="22" font-weight="700" text-anchor="middle">gated-deploy client</text>
  <text x="230" y="244" fill="#8b9aa6" font-size="16" text-anchor="middle">one binary, shared by every harness</text>

  <!-- divider between the two machines -->
  <line x1="40" y1="300" x2="1160" y2="300" stroke="#1e4652" stroke-width="2" stroke-dasharray="3 8"/>
  <text x="1160" y="288" fill="#6f828f" font-size="15" letter-spacing="2" text-anchor="end">AGENT MACHINE</text>
  <text x="1160" y="326" fill="#6f828f" font-size="15" letter-spacing="2" text-anchor="end">HOMELAB SERVER</text>

  <!-- api service -->
  <rect x="60" y="350" width="340" height="92" rx="12" fill="#14303a" stroke="#1e4652" stroke-width="2"/>
  <text x="230" y="382" fill="#f1f5f9" font-size="22" font-weight="700" text-anchor="middle">API service</text>
  <text x="230" y="408" fill="#8b9aa6" font-size="16" text-anchor="middle">unprivileged user, loopback port</text>
  <text x="230" y="428" fill="#8b9aa6" font-size="15" text-anchor="middle">POST /deploy { host, action, branch }</text>

  <!-- allowlist -->
  <rect x="520" y="350" width="330" height="92" rx="12" fill="#12262f" stroke="#3b82f6" stroke-width="2"/>
  <text x="685" y="382" fill="#f1f5f9" font-size="21" font-weight="700" text-anchor="middle">Nix allowlist</text>
  <text x="685" y="408" fill="#8b9aa6" font-size="16" text-anchor="middle">generated by the flake at build time</text>
  <text x="685" y="428" fill="#8b9aa6" font-size="16" text-anchor="middle">argv arrays, not command strings</text>

  <!-- helper -->
  <rect x="60" y="480" width="340" height="92" rx="12" fill="#14303a" stroke="#1e4652" stroke-width="2"/>
  <text x="230" y="512" fill="#f1f5f9" font-size="22" font-weight="700" text-anchor="middle">root helper</text>
  <text x="230" y="538" fill="#8b9aa6" font-size="16" text-anchor="middle">one sudoers rule, job id only</text>
  <text x="230" y="558" fill="#8b9aa6" font-size="15" text-anchor="middle">checks out the branch, builds the argv</text>

  <!-- unit -->
  <rect x="60" y="610" width="340" height="92" rx="12" fill="#12262f" stroke="#3b82f6" stroke-width="2"/>
  <text x="230" y="642" fill="#f1f5f9" font-size="20" font-weight="700" text-anchor="middle">transient systemd unit</text>
  <text x="230" y="670" fill="#8b9aa6" font-size="16" text-anchor="middle">nixos-rebuild switch --flake .#host</text>

  <!-- arrows: agent -> mcp -->
  <line x1="400" y1="82" x2="810" y2="82" stroke="#7d8f9c" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowMuted)"/>
  <text x="605" y="70" fill="#9fb3c0" font-size="15" text-anchor="middle">asks for real option and package names</text>

  <!-- arrows: agent -> client -->
  <line x1="230" y1="124" x2="230" y2="172" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="248" y="154" fill="#9fb3c0" font-size="15">runs</text>

  <!-- arrows: client -> api -->
  <line x1="230" y1="264" x2="230" y2="342" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="248" y="316" fill="#9fb3c0" font-size="15">HTTPS over the tailnet, bearer token</text>

  <!-- arrows: api -> helper -->
  <line x1="230" y1="442" x2="230" y2="472" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="248" y="464" fill="#9fb3c0" font-size="15">sudo: one job id</text>

  <!-- arrows: helper -> unit -->
  <line x1="230" y1="572" x2="230" y2="602" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="248" y="594" fill="#9fb3c0" font-size="15">systemd-run</text>

  <!-- allowlist reads -->
  <line x1="400" y1="396" x2="512" y2="396" stroke="#7d8f9c" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowMuted)"/>
  <text x="456" y="386" fill="#9fb3c0" font-size="14" text-anchor="middle">reads</text>

  <path d="M 685 442 L 685 526 L 408 526" fill="none" stroke="#7d8f9c" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowMuted)"/>
  <text x="600" y="516" fill="#9fb3c0" font-size="14" text-anchor="middle">builds the argv</text>

  <!-- footer -->
  <text x="60" y="740" fill="#6f828f" font-size="16">The agent never holds a shell on the server, and never reads a file on it.</text>
</svg>
